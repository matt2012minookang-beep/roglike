function spawnEnemy(kind,boss=false){let x,y;for(let i=0;i<10;i++){const edge=Math.floor(rand()*4);x=edge===0?25:edge===1?W-25:range(25,W-25);y=edge===2?25:edge===3?H-25:range(25,H-25);if(Math.hypot(x-R.hero.x,y-R.hero.y)>150)break}const d=boss?{name:bossName(R.round),hp:R.round===4?240:R.round===8?570:1150,speed:18+R.round*.7,damage:13+R.round,r:19,art:R.round===4?'warden':R.round===8?'golem':'king',gold:20+R.round}:FOES[kind],hp=boss?d.hp:d.hp*1.14**(R.round-1);const e={uid:uid(),kind,boss,name:d.name,x,y,r:d.r,hp,maxHp:hp,speed:d.speed*(boss?1:1+(R.round-1)*.018),damage:d.damage*(boss?1:1+(R.round-1)*.075),gold:d.gold,art:d.art,flash:0,poison:0,poisonDamage:0,burn:0,burnDamage:0,dotCD:.5,slow:0,slowFactor:1,bladeCD:0,attackCD:boss?2:range(1.2,3),pattern:0,charge:0,warn:0,chargeX:0,chargeY:0,dead:false};R.enemies.push(e);if(boss){banner('BOSS ENCOUNTER',e.name);sfx('boss')}return e}

function stepEnemy(e,dt){if(e.dead)return;const p=R.hero;e.flash=Math.max(0,e.flash-dt);e.bladeCD=Math.max(0,e.bladeCD-dt);e.attackCD-=dt;e.dotCD-=dt;e.slow=Math.max(0,e.slow-dt);if(e.slow<=0)e.slowFactor=1;if(e.poison>0)e.poison-=dt;if(e.burn>0)e.burn-=dt;if(e.dotCD<=0){e.dotCD+=.5;if(e.poison>0)hit(e,e.poisonDamage*.5,{crit:false,quiet:true});if(e.burn>0&&!e.dead)hit(e,e.burnDamage*.5,{crit:false,quiet:true})}if(e.dead)return;const d=Math.max(1,dist(e,p));let dx=(p.x-e.x)/d,dy=(p.y-e.y)/d,speed=e.speed*e.slowFactor;if(e.warn>0){e.warn-=dt;speed=0;if(e.warn<=0)e.charge=e.boss?.65:.48}else if(e.charge>0){e.charge-=dt;dx=e.chargeX;dy=e.chargeY;speed=e.boss?172:150}else if(e.boss&&e.attackCD<=0){const pat=e.pattern++%3;e.attackCD=e.kind==='king'?2.7:3.4;if(pat===0){const count=10+Math.floor(R.round/4)*2,offset=rad(p.x-e.x,p.y-e.y);for(let i=0;i<count;i++)hostile(e,offset+i*Math.PI*2/count,68+R.round*2,e.damage*.75);sfx('magic')}else if(pat===1){hazard(p.x,p.y,39,e.damage,1);if(R.round>=8){hazard(p.x-65,p.y+40,33,e.damage*.8,1.15);hazard(p.x+65,p.y-40,33,e.damage*.8,1.15)}}else{e.warn=.72;e.chargeX=dx;e.chargeY=dy}}else if(!e.boss&&e.kind==='mage'){if(d<155){dx=-dx;dy=-dy;speed*=.6}else if(d<205)speed=0;if(e.attackCD<=0){const a=rad(p.x-e.x,p.y-e.y);hostile(e,a,95);if(R.round>=9){hostile(e,a-.2,90);hostile(e,a+.2,90)}e.attackCD=2.5}}else if(!e.boss&&e.kind==='golem'&&d<100&&e.attackCD<=0){hazard(e.x,e.y,48,e.damage,.85);e.attackCD=3.5}else if(!e.boss&&e.kind==='wraith'&&e.attackCD<=0){e.warn=.45;e.chargeX=dx;e.chargeY=dy;e.attackCD=3.2}if(e.warn<=0&&e.charge<=0){const len=Math.max(1,Math.hypot(dx,dy));dx/=len;dy/=len}moveBody(e,dx*speed*dt,dy*speed*dt);if(dist(e,p)<e.r+p.r){if(hurt(e.damage)&&!R.finished){const push=8;moveBody(e,-dx*push,-dy*push)}}}
function stepBullets(dt){const p=R.hero;for(const b of R.bullets){if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<10||b.x>W-10||b.y<18||b.y>H-10){if(b.source==='fire')explode(b.x,b.y,p.fireRadius,b.damage,true);b.dead=true;continue}for(const e of R.enemies){if(e.dead||b.hits.includes(e.uid)||dist(e,b)>e.r+b.r)continue;b.hits.push(e.uid);if(b.source==='fire'){explode(b.x,b.y,p.fireRadius,b.damage,true);b.dead=true;break}hit(e,b.damage);if(b.source==='main'&&!e.dead){if(p.poison){e.poison=3;e.poisonDamage=p.poison}if(p.chill){e.slow=1.5;e.slowFactor=Math.min(e.slowFactor,1-p.chill)}const len=Math.hypot(b.vx,b.vy);moveBody(e,b.vx/len*2.8*p.knock,b.vy/len*2.8*p.knock)}if(b.source==='main'&&p.blastDamage&&rand()<.25)explode(b.x,b.y,p.blastRadius,p.blastDamage);particles(b.x,b.y,'#cfcca0',3);if(b.bounces>0){const next=nearest(e.x,e.y,b.hits,180);if(next){const angle=rad(next.x-b.x,next.y-b.y),speed=Math.hypot(b.vx,b.vy);b.vx=Math.cos(angle)*speed;b.vy=Math.sin(angle)*speed;b.bounces--;break}}if(b.pierce>0)b.pierce--;else{b.dead=true;break}}}R.bullets=R.bullets.filter(b=>!b.dead);for(const b of R.hostiles){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life>0&&dist(b,p)<b.r+p.r){hurt(b.damage);b.life=0}if(R.finished)return}R.hostiles=R.hostiles.filter(b=>b.life>0&&b.x>8&&b.x<W-8&&b.y>15&&b.y<H-8)}
function stepHazards(dt){for(const z of R.hazards){if(!z.active){z.time-=dt;if(z.time<=0){z.active=true;if(dist(z,R.hero)<z.r+R.hero.r)hurt(z.damage);ring(z.x,z.y,z.r,'#e8a575',.4);particles(z.x,z.y,'#db9a6d',12)}}else z.life-=dt;if(R.finished)return}R.hazards=R.hazards.filter(z=>!z.active||z.life>0)}
function stepPickups(dt){const p=R.hero;for(const c of R.pickups){const d=dist(c,p);if(d<p.magnet){const v=Math.min(d,dt*(110+(p.magnet-d)*4));c.x+=(p.x-c.x)/Math.max(1,d)*v;c.y+=(p.y-c.y)/Math.max(1,d)*v}if(d<12){if(c.gold){R.gold+=c.gold;R.wave.earned+=c.gold}else {heal(c.heal);addText(p.x,p.y-19,'+'+c.heal,'#b4dba1');sfx('heal')}c.dead=true}}R.pickups=R.pickups.filter(c=>!c.dead)}
function stepBlades(){const p=R.hero;if(!p.blades)return;for(let i=0;i<p.blades;i++){const a=R.stats.time*2.8+i*Math.PI*2/p.blades,x=p.x+Math.cos(a)*43,y=p.y+Math.sin(a)*43;for(const e of R.enemies){if(!e.dead&&e.bladeCD<=0&&Math.hypot(e.x-x,e.y-y)<e.r+7){hit(e,p.bladeDamage);e.bladeCD=.4;particles(x,y,'#d7dac1',3)}}}}
function update(dt){if(!R||R.finished||screen!=='play'||paused||modal)return;R.stats.time+=dt;const wave=R.wave;wave.time+=dt;stepHero(dt);if(R.finished)return;wave.spawnCD-=dt;if(wave.spawned<wave.total&&wave.spawnCD<=0&&R.enemies.filter(e=>!e.dead).length<35){spawnEnemy(spawnKind());wave.spawned++;wave.spawnCD=wave.interval}if(wave.boss&&!wave.bossSpawned&&wave.time>5+R.round*.3){spawnEnemy(R.round===12?'king':'boss',true);wave.bossSpawned=true}for(const e of R.enemies){stepEnemy(e,dt);if(R.finished)return}const es=R.enemies;for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){const a=es[i],b=es[j];if(a.dead||b.dead)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),min=(a.r+b.r)*.85;if(d>0&&d<min){const push=(min-d)*.28;moveBody(a,dx/d*push,dy/d*push);moveBody(b,-dx/d*push,-dy/d*push)}}stepBullets(dt);if(R.finished)return;stepBlades();stepHazards(dt);if(R.finished)return;stepPickups(dt);R.enemies=R.enemies.filter(e=>!e.dead);if(wave.spawned>=wave.total&&(!wave.boss||wave.bossSpawned)&&R.enemies.length===0){clearWave();return}hudClock+=dt;saveClock+=dt;if(hudClock>.1){hudClock=0;updateHud()}if(saveClock>5){saveClock=0;save()}}
function updateHud(){if(screen!=='play'||!R)return;const p=R.hero,w=R.wave;$('#hpText').textContent=`${Math.ceil(p.hp)} / ${p.maxHp}`;$('#hpFill').style.width=p.hp/p.maxHp*100+'%';$('#health').classList.toggle('health-low',p.hp/p.maxHp<.25);$('#goldText').textContent=R.gold;$('#waveClock').textContent=`${fmt(w.time/60)}:${fmt(w.time%60)}`;const total=w.total+(w.boss?1:0),left=w.total-w.spawned+R.enemies.length+(w.boss&&!w.bossSpawned?1:0),done=total-left;$('#waveFill').style.width=clamp(done/total*100,0,100)+'%';$('#aliveText').textContent=`남은 적 ${left} / ${total}`;$('#dashFill').style.width=(1-p.dashCD/p.dashMax)*100+'%';$('#dashText').textContent=p.dashCD>.05?p.dashCD.toFixed(1)+'s':'준비';$('#touchDash').style.opacity=p.dashCD>0?'.45':'1';$('#damageStat').textContent=num(p.damage*p.allDamage*(p.hp<=p.maxHp*.5?1+p.fury:1));const boss=R.enemies.find(e=>e.boss&&!e.dead);$('#bossHud').hidden=!boss;if(boss){$('#bossName').textContent=boss.name;$('#bossFill').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%'}if(w.time>6)$('#startHelp')?.remove()}
function makeOffers(){const pool=Object.keys(UPGRADES).filter(id=>level(id)<UPGRADES[id].max),out=[];if(R.round<=2&&!Object.keys(R.upgrades).some(id=>UPGRADES[id].tag==='보조 무기')){const id=pick(pool.filter(id=>UPGRADES[id].tag==='보조 무기'));out.push(id);pool.splice(pool.indexOf(id),1)}while(out.length<3&&pool.length){const weights=pool.map(id=>{const d=UPGRADES[id];return d.rarity==='epic'?(R.wave.boss?7:2+R.hero.luck*20+R.round*.15):d.rarity==='rare'?6+R.hero.luck*15:10});let n=rand()*weights.reduce((a,b)=>a+b,0),j=0;for(;j<weights.length-1;j++){n-=weights[j];if(n<0)break}out.push(pool.splice(j,1)[0])}return out}
function clearWave(){for(const c of R.pickups){if(c.gold){R.gold+=c.gold;R.wave.earned+=c.gold}else heal(c.heal)}R.pickups=[];R.cleared=R.round;R.hostiles=[];R.hazards=[];R.bullets=[];if(R.round===MAX_ROUND){finishRun(true);return}const h=heal(R.wave.boss?22:7),bonus=R.wave.boss?20:6;R.gold+=bonus;R.reward={offers:makeOffers(),rerolls:0,earned:R.wave.earned+bonus,healed:h,chosen:null};screen='reward';input.keys.clear();input.joy.active=false;input.pointer.down=false;sfx('reward');save();render()}
function renderReward(){const rw=R.reward;main.innerHTML=`<section class="screen">${runHead('라운드 '+R.round+' 클리어')}<div class="room-title"><div class="eyebrow">ONE ROUND STRONGER</div><h1>살아남은 당신에게, 한 장의 힘</h1><p>강화 카드 <b class="gold">3장 중 1장</b>을 선택하세요. 효과는 이번 도전이 끝날 때까지 누적됩니다.</p><div class="reward-line"><span>${icon('coin',12)} 이번 라운드 +${rw.earned} G</span><span class="green">${icon('heart',12)} 체력 +${num(rw.healed)}</span>${R.wave.boss?'<span>보스 보상 · 전설 확률 UP</span>':''}</div></div><div class="upgrade-choices">${rw.offers.map(id=>upgradeHTML(id)).join('')}</div><div class="center"><button class="btn ghost reroll-btn" data-action="reroll">${icon('star',12)} 카드 다시 뽑기 <span class="gold">${15+rw.rerolls*10} G</span></button><div class="next-info"><span>다음: ${R.round+1}라운드${(R.round+1)%4===0?' · 보스 등장':''}</span><span>일반 적 체력 ×${(1.14**R.round).toFixed(2)}</span><span>공격력 ×${(1+R.round*.075).toFixed(2)}</span></div><p class="ready-note">카드에 적힌 효과를 추가로 획득합니다. 같은 카드를 고르면 효과가 중첩됩니다.</p></div></section>`}
function chooseUpgrade(id){if(screen!=='reward'||modal||!R.reward.offers.includes(id)||level(id)>=UPGRADES[id].max)return;const p=R.hero;R.reward.before={damage:p.damage*p.allDamage,rate:p.rate,hp:p.maxHp,shots:p.shots};UPGRADES[id].apply(p);R.upgrades[id]=(R.upgrades[id]||0)+1;R.reward.chosen=id;screen='ready';sfx('reward');save();render()}
function renderReady(){const id=R.reward.chosen,d=UPGRADES[id],p=R.hero;main.innerHTML=`<section class="screen">${runHead('새로운 힘을 얻었다')}<div class="room-title"><div class="eyebrow">BUILD EVOLVED / LV.${level(id)}</div><h1>${d.name}${level(id)>1?' · '+level(id)+'단계':''}</h1><p>선택한 힘이 당신에게 깃들었습니다. 더 거센 다음 라운드가 기다립니다.</p></div><div class="ready-layout"><div class="selected-wrap">${upgradeHTML(id,true,true)}</div><div><div class="summary"><h3>${R.round+1}라운드 준비</h3><div class="stat-row"><span>주 무기 공격력</span><strong>${num(p.damage*p.allDamage)}</strong></div><div class="stat-row"><span>발사 / 초</span><strong>${p.shots}발 / ${num(p.rate)}회</strong></div><div class="stat-row"><span>보유 강화 카드</span><strong>${Object.values(R.upgrades).reduce((a,b)=>a+b,0)}장</strong></div><div class="divider"></div><p>${(R.round+1)%4===0?`<b class="gold">보스 등장 · ${bossName(R.round+1)}</b><br>`:''}일반 적의 체력은 14% 증가합니다.<br>쌓아 올린 강화 효과로 돌파하세요.</p></div><button class="btn primary" data-action="next-round">${R.round+1}라운드 시작 →</button></div></div></section>`}
function nextRound(){if(screen!=='ready')return;R.round++;screen='play';fx=[];texts=[];startWave();render();banner(`ROUND ${fmt(R.round)}`,R.round%4===0?'보스의 기척이 다가온다':stageName(R.round));sfx('start')}
function reroll(){if(screen!=='reward')return;const price=15+R.reward.rerolls*10;if(R.gold<price){toast('골드가 부족해요. 라운드에서 얻은 금화로 다시 뽑을 수 있습니다.');sfx('no');return}R.gold-=price;R.reward.rerolls++;R.reward.offers=makeOffers();sfx('magic');save();render()}
function finishRun(win){if(!R||R.finished)return;R.finished=true;R.won=win;paused=false;closeModal();input.keys.clear();meta.runs++;if(win)meta.wins++;meta.best=Math.max(meta.best,R.cleared);put(META_KEY,meta);erase(SAVE_KEY);saved=null;screen='end';sfx(win?'victory':'death');render()}
function renderEnd(){const win=R.won;main.innerHTML=`<section class="screen end-screen"><div style="margin:18px 0">${icon(win?'crown':'fire',45,win?'#efc980':'#b99175')}</div><div class="eyebrow">${win?'THE LAST EMBER WILL LIVE ON':'ANOTHER ROUND. ANOTHER CHANCE.'}</div><h1>${win?'잿불은 끝내 꺼지지 않았다':'다음엔, 한 라운드 더'}</h1><p>${win?'12라운드 돌파. 마지막 잿불의 왕까지 쓰러뜨렸습니다.':R.round+'라운드에서 불씨가 사그라들었습니다. 새로운 카드 조합으로 다시 도전하세요.'}</p><div class="end-stats"><div class="end-stat"><strong>${R.cleared}<small style="font-size:13px;color:#8da37d">/12</small></strong><span>클리어 라운드</span></div><div class="end-stat"><strong>${R.stats.kills}</strong><span>처치한 적</span></div><div class="end-stat"><strong>${Object.values(R.upgrades).reduce((a,b)=>a+b,0)}</strong><span>획득한 강화</span></div><div class="end-stat"><strong>${fmt(R.stats.time/60)}:${fmt(R.stats.time%60)}</strong><span>생존 시간</span></div></div><div class="end-build">${loadoutHTML()}</div><div class="end-actions"><button class="btn primary" data-action="new">${icon('fire',14)} 다시 도전</button><button class="btn ghost" data-action="build">강화 조합 보기</button><button class="btn ghost" data-action="home">타이틀로</button></div><p class="ready-note" style="margin-top:23px">다시 도전하면 같은 기본 능력으로 시작합니다. 이전 기록만 남습니다.</p></section>`}
function banner(title,sub){if(!prefs.motion)return;const st=$('#arena');if(!st)return;const el=document.createElement('div');el.className='round-banner';el.innerHTML=`<b>${title}</b><span>${sub}</span>`;st.appendChild(el);setTimeout(()=>el.remove(),2500)}
function showModal(title,sub,body){input.keys.clear();input.pointer.down=false;input.joy.active=false;modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" data-action="close" aria-label="닫기">×</button></div>${body}</section></div>`;drawArts();modalRoot.querySelector('.close').focus()}
function closeModal(){modal=null;modalRoot.innerHTML='';input.keys.clear();input.pointer.down=false;input.joy.active=false}
function openBuild(){if(!R)return;modal={type:'build'};showModal('이번 도전의 강화 카드','선택한 카드의 효과는 이번 도전이 끝날 때까지 누적됩니다.',Object.keys(R.upgrades).length?`<div class="upgrade-grid">${Object.keys(R.upgrades).map(id=>upgradeHTML(id,true)).join('')}</div>`:'<div class="empty">아직 강화가 없습니다. 1라운드를 클리어하면 세 장 중 한 장을 고를 수 있습니다.</div>')}
function openHelp(){modal={type:'help'};showModal('라운드를 넘고, 한 장씩 강해지기','전투 → 라운드 클리어 → 강화 카드 선택 → 더 강한 다음 라운드',`<div class="help-grid"><div><h3>전투와 성장</h3><p>캐릭터를 움직이며 적과 투사체를 피하세요. 가까운 적을 자동으로 공격합니다. 라운드의 <b>모든 적을 처치</b>하면 강화 카드 3장 중 1장을 선택합니다.</p><p>강화는 이번 도전 내내 누적되고 같은 카드도 중첩됩니다. 공격력·다중 탄환 같은 기본 강화와 회전 칼날·연쇄 번개 같은 보조 무기를 조합하세요.</p><p>다음 라운드는 적의 수·체력·공격력이 증가합니다. <b>4·8·12라운드</b>에는 보스가 등장합니다. 12라운드를 끝내면 승리입니다.</p><h3>조작</h3><p><span class="kbd">WASD</span> / <span class="kbd">방향키</span> 이동<br><span class="kbd">SPACE</span> 질주 — 잠깐 무적, 기본 대기 3.2초<br><span class="kbd">ESC</span> 일시정지 / 창 닫기<br>모바일: 왼쪽 원형 패드 이동, 오른쪽 「질주」 버튼.</p></div><div><h3>생존 요령</h3><p>빨간 원은 적의 범위 공격 예고입니다. 원이 완성되기 전에 벗어나세요. 보스는 탄막과 돌진도 사용합니다. 질주로 투사체를 지나갈 수 있습니다.</p><p>일반 라운드 클리어 시 체력 7, 보스 라운드 뒤에는 22를 회복합니다. 작은 초록 회복 구슬도 놓치지 마세요.</p><h3>금화와 저장</h3><p>적이 떨어뜨린 금화를 모으면 강화 카드를 다시 뽑을 수 있습니다. 남은 금화와 회복 구슬은 라운드 종료 시 자동으로 획득합니다.</p><p>같은 브라우저에 진행을 자동 저장합니다. 일시정지 메뉴에서 저장하고 나갈 수도 있습니다. 패배하면 카드와 능력이 초기화되고 도전 기록만 남습니다.</p></div></div>`)}
function openMenu(title='불씨는 잠시 쉬어갑니다'){if(!R||R.finished)return;modal={type:'menu'};showModal(title,'일시정지 중 · 현재 상태를 자동 저장합니다.',`<div class="options"><button class="option" data-action="close"><strong>계속하기 →</strong><small>다음 라운드를 향해 나아갑니다.</small></button><button class="option" data-action="save-home"><strong>저장하고 타이틀로</strong><small>다음에 「이어 하기」로 돌아올 수 있습니다.</small></button><button class="option" data-action="help"><strong>플레이 안내</strong><small>라운드와 강화, 조작법을 확인합니다.</small></button></div><div class="setting"><span>조준 방식</span><button class="btn ghost" data-action="aim">${prefs.aim==='auto'?'자동 조준·발사':'마우스 조준·클릭 발사'}</button></div><div class="setting"><span>화면 효과</span><button class="btn ghost" data-action="motion">${prefs.motion?'켜짐':'꺼짐'}</button></div><div style="margin-top:20px"><button class="text-btn" data-action="abandon" style="color:#dca186">이번 도전 포기</button></div>`);save()}

function act(a){switch(a){case'new':confirmNew();break;case'new-confirm':closeModal();newRun();break;case'continue':continueRun();break;case'close':closeModal();break;case'help':openHelp();break;case'build':openBuild();break;case'home':goHome();break;case'next-round':nextRound();break;case'reroll':reroll();break;case'save-home':save();goHome();break;case'aim':prefs.aim=prefs.aim==='auto'?'manual':'auto';put(PREF_KEY,prefs);openMenu();break;case'motion':prefs.motion=!prefs.motion;put(PREF_KEY,prefs);header();openMenu();break;case'abandon':modal={type:'abandon'};showModal('이번 도전을 끝낼까요?','획득한 강화와 진행이 사라집니다.',`<div class="center"><button class="btn danger" data-action="abandon-confirm">도전 포기</button> <button class="btn ghost" data-action="close">돌아가기</button></div>`);break;case'abandon-confirm':closeModal();finishRun(false);break}}
function bindArena(){const canvas=$('#sceneCanvas'),arena=$('#arena'),stick=$('#touchStick'),knob=$('#touchKnob');canvas.addEventListener('pointermove',e=>{const b=canvas.getBoundingClientRect();input.pointer.x=(e.clientX-b.left)/b.width*W;input.pointer.y=(e.clientY-b.top)/b.height*H});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){input.pointer.down=true;arena.focus({preventScroll:true});e.preventDefault()}});stick.addEventListener('pointerdown',e=>{e.preventDefault();input.joy.active=true;input.joy.id=e.pointerId;const b=stick.getBoundingClientRect();input.joy.startX=b.left+b.width/2;input.joy.startY=b.top+b.height/2;stick.setPointerCapture(e.pointerId);joy(e)});function joy(e){if(!input.joy.active||input.joy.id!==e.pointerId)return;const dx=e.clientX-input.joy.startX,dy=e.clientY-input.joy.startY,len=Math.hypot(dx,dy),max=27;input.joy.x=dx/Math.max(max,len);input.joy.y=dy/Math.max(max,len);knob.style.transform=`translate(${input.joy.x*max}px,${input.joy.y*max}px)`;stick.classList.add('active')}stick.addEventListener('pointermove',e=>{e.preventDefault();joy(e)});function endJoy(e){if(e.pointerId===input.joy.id){input.joy.active=false;input.joy.id=null;input.joy.x=0;input.joy.y=0;knob.style.transform='';stick.classList.remove('active')}}stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);$('#touchDash').addEventListener('pointerdown',e=>{e.preventDefault();requestDash();audioInit()})}
document.addEventListener('pointerup',()=>input.pointer.down=false);document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')document.documentElement.classList.add('touch-control-mode')},{passive:true});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(modal&&!modalRoot.contains(el))return;audioInit();if(el.dataset.action)act(el.dataset.action);else if(el.dataset.upgrade)chooseUpgrade(el.dataset.upgrade)});
$('#brand').onclick=()=>{if(modal)return;if(R&&screen!=='end')openMenu();else if(screen==='end')goHome()};$('#helpBtn').onclick=()=>{if(!modal)openHelp()};$('#buildBtn').onclick=()=>{if(!modal)openBuild()};$('#menuBtn').onclick=()=>{if(!modal)openMenu()};$('#soundBtn').onclick=()=>{prefs.sound=!prefs.sound;put(PREF_KEY,prefs);audioInit();header();if(prefs.sound)sfx('click')};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const key=e.key.toLowerCase();if(key==='escape'){e.preventDefault();if(modal)closeModal();else if(R&&!R.finished)openMenu();return}if(modal){if(e.key==='Tab'){const items=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault()}}return}if(screen==='play'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)){e.preventDefault();if(key===' '&&!e.repeat)requestDash();else input.keys.add(key)}});

function tone(freq,duration=.12,type='square',volume=.025,when=0,endFreq=null){if(!audioCtx||!prefs.sound||audioCtx.state!=='running')return;try{const t=audioCtx.currentTime+when,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+duration);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.01)}catch{}}
function audioInit(){if(!prefs.sound)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();musicNext=audioCtx.currentTime+.2;musicTimer=setInterval(music,160)}if(audioCtx.state==='suspended'&&!document.hidden)audioCtx.resume().catch(()=>{})}catch{}}
function music(){if(!audioCtx||!prefs.sound||document.hidden||audioCtx.state!=='running'){if(audioCtx)musicNext=audioCtx.currentTime+.2;return}if(musicNext<audioCtx.currentTime)musicNext=audioCtx.currentTime+.05;const melody=[69,0,72,0,76,0,72,0,67,0,71,0,74,0,71,0,65,0,69,0,72,0,69,0,64,0,67,0,71,0,67,0];while(musicNext<audioCtx.currentTime+.25){const step=musicStep%32,delay=musicNext-audioCtx.currentTime;if(melody[step])tone(440*2**((melody[step]-69)/12),.18,'triangle',.018,delay);if(step%4===0){const n=[45,43,41,40][Math.floor(step/8)];tone(440*2**((n-69)/12),.35,'triangle',.022,delay)}if(screen==='play'&&step%2===0)tone(step%4?180:75,.045,'square',.006,delay,40);musicStep++;musicNext+=.23}}

function pixelCircle(ctx,x,y,r,color,dashed=false){ctx.fillStyle=color;for(let a=0;a<Math.PI*2;a+=Math.max(.055,3/r)){if(dashed&&Math.floor(a*8)%2)continue;ctx.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),2,2)}}

function drawActor(ctx,e,hero=false){const p=R.hero,t=visualTime;if(hero){pix(ctx,p.x-10,p.y+6,20,4,'#142b2077');if(p.inv>0)ctx.globalAlpha=Math.floor(t*16)%2?.45:.9;if(p.lastX<-.1){ctx.save();ctx.scale(-1,1);sprite(ctx,'hero',-p.x,p.y+8,1.1,p.hitFlash>0);ctx.restore()}else sprite(ctx,'hero',p.x,p.y+8,1.1,p.hitFlash>0);ctx.globalAlpha=1;if(p.dashTime>0)pixelCircle(ctx,p.x,p.y-3,13,'#b4dec2');return}pix(ctx,e.x-e.r,e.y+e.r*.45,e.r*2,e.r*.42,'#10271c77');const sc=e.boss?(e.art==='golem'?1.9:1.8):e.art==='golem'?1.2:e.art==='slime'?1.1:e.art==='bat'?1.15:1.05,bob=e.art==='bat'?Math.sin(t*7+e.uid)*2:e.art==='wraith'?Math.sin(t*3+e.uid):0;sprite(ctx,e.art,e.x,e.y+(e.boss?17:7)+bob,sc,e.flash>0);if(e.poison>0)pix(ctx,e.x-5,e.y-e.r-10,3,3,'#bdd080');if(e.burn>0)flame(ctx,e.x+e.r*.4,e.y-3,.6,t);if(e.slow>0){pix(ctx,e.x-e.r,e.y+7,e.r*2,2,'#9fcbd0')}if(!e.boss&&e.hp<e.maxHp){const ww=e.r*2;pix(ctx,e.x-e.r,e.y-e.r-12,ww,2,'#1c281c');pix(ctx,e.x-e.r,e.y-e.r-12,ww*Math.max(0,e.hp/e.maxHp),2,'#c5a779')}if(e.warn>0){const len=e.boss?120:90;for(let j=0;j<5;j++)pixelLine(ctx,e.x+e.chargeX*j*len/5,e.y+e.chargeY*j*len/5,e.x+e.chargeX*(j+.55)*len/5,e.y+e.chargeY*(j+.55)*len/5,'#db9a73',1)}}

;sprite(ctx,'hero',f.x,f.y+8,1.1)}else if(f.kind==='chain'){for(let i=1;i<f.points.length;i++){const a=f.points[i-1],b=f.points[i],steps=8;let lx=a.x,ly=a.y;for(let j=1;j<=steps;j++){const x=a.x+(b.x-a.x)*j/steps+(j===steps?0:Math.sin(visualTime*70+j*9)*4),y=a.y+(b.y-a.y)*j/steps+(j===steps?0:Math.cos(visualTime*64+j*7)*4);pixelLine(ctx,lx,ly,x,y,'#bed6e0',2);lx=x;ly=y}}}ctx.globalAlpha=1}for(const t of texts){ctx.globalAlpha=clamp(t.life/.2,0,1);ctx.font=(t.big?'bold 10':'8')+'px monospace';ctx.textAlign='center';ctx.fillStyle='#15281f';ctx.fillText(t.text,Math.round(t.x)+1,Math.round(t.y)+1);ctx.fillStyle=t.color;ctx.fillText(t.text,Math.round(t.x),Math.round(t.y));ctx.globalAlpha=1}}
